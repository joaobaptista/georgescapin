<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1612"/>
      <stop offset="100%" stop-color="#040705"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1b2"/>
      <stop offset="45%" stop-color="#d4af65"/>
      <stop offset="100%" stop-color="#967530"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf96" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#967530" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo com cantos arredondados (squircle) e borda dourada nobre -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="16"/>
  
  <!-- Círculo interno decorativo sutil -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 10" opacity="0.35"/>
  
  <!-- Monograma GS Dr. George Scapin -->
  <text x="256" y="325" font-family="'Playfair Display', 'Georgia', serif" font-size="220" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-6">GS</text>

  <!-- Brilho de Estética e Precisão (Sparkle) -->
  <path d="M375 135 Q375 170 410 170 Q375 170 375 205 Q375 170 340 170 Q375 170 375 135 Z" fill="url(#goldGrad)"/>
</svg>
