<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18221c"/>
      <stop offset="100%" stop-color="#080c0a"/>
    </linearGradient>
    <linearGradient id="adminGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7be"/>
      <stop offset="50%" stop-color="#d4af65"/>
      <stop offset="100%" stop-color="#8c6b28"/>
    </linearGradient>
    <linearGradient id="adminShieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(212,175,101,0.25)"/>
      <stop offset="100%" stop-color="rgba(212,175,101,0.05)"/>
    </linearGradient>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#adminBg)" stroke="url(#adminGold)" stroke-width="16"/>
  
  <!-- Escudo Protetor do Painel Admin -->
  <path d="M256 80 L395 130 V255 C395 345 256 425 256 425 C256 425 117 345 117 255 V130 Z" fill="url(#adminShieldFill)" stroke="url(#adminGold)" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Monograma GS no Escudo -->
  <text x="256" y="295" font-family="'Playfair Display', 'Georgia', serif" font-size="140" font-weight="700" fill="url(#adminGold)" text-anchor="middle">GS</text>
  
  <!-- Ícone de Chave / Cadeado / Estrela Superior -->
  <circle cx="256" cy="175" r="14" fill="url(#adminGold)"/>
</svg>
